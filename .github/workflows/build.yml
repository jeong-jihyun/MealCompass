name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          tail -n 60 build.log
          if [ $code -ne 0 ]; then
            # 실패하면 핵심 오류 줄만 모아서 하나의 주석(Annotation)으로 남긴다
            msg=$(grep -E "^e: |What went wrong|Execution failed|Could not |requires |compileSdk|AAR metadata|error:|^> |Caused by" build.log | head -40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Gradle 빌드 실패::${msg}"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: MealCompass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
